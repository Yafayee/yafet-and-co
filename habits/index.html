<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="A daily habit system based on Atomic Habits.">
<meta name="theme-color" content="#1B1F3B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="1% System">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The 1% System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;700&family=Sora:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#F2F3F9; --surface:#FFFFFF; --surface-2:#EBEDF6; --ink:#1B1F3B; --muted:#646A86; --line:#DEE1EE;
  --accent:#FF5A36; --accent-ink:#FFFFFF; --amber:#F5A524; --good:#17A884; --good-soft:#DDF5EE; --warn:#C7780A; --warn-soft:#FFF0D6; --bad:#D63E4B;
  --hero:#1B1F3B; --hero-2:#2A2F5A; --hero-ink:#FFFFFF; --hero-muted:#AEB3D6;
  --shadow:0 1px 2px rgba(27,31,59,.06),0 6px 20px rgba(27,31,59,.07);
  --display:"Sora","Segoe UI",system-ui,sans-serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1024; --surface:#161A33; --surface-2:#1F2442; --ink:#ECEEFA; --muted:#9CA2C2; --line:#2A2F52;
    --accent:#FF7A5A; --accent-ink:#0D1024; --amber:#FFC062; --good:#3DD6AE; --good-soft:#12352E; --warn:#F1B35A; --warn-soft:#3A2A12; --bad:#FF7B86;
    --hero:#1D2250; --hero-2:#2B3170; --hero-ink:#FFFFFF; --hero-muted:#B4B9E0;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1024; --surface:#161A33; --surface-2:#1F2442; --ink:#ECEEFA; --muted:#9CA2C2; --line:#2A2F52;
  --accent:#FF7A5A; --accent-ink:#0D1024; --amber:#FFC062; --good:#3DD6AE; --good-soft:#12352E; --warn:#F1B35A; --warn-soft:#3A2A12; --bad:#FF7B86;
  --hero:#1D2250; --hero-2:#2B3170; --hero-ink:#FFFFFF; --hero-muted:#B4B9E0;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);min-height:100%}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.015em}
h1{font-size:26px;font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font:700 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:15px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.iconbtn{appearance:none;border:0;background:var(--surface-2);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.iconbtn svg{width:20px;height:20px}

/* status + top */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font:800 17px var(--display);letter-spacing:-.02em}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 12px var(--mono)}
.status{font:500 11.5px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.local{background:var(--warn)} .dot.err{background:var(--bad)}

/* hero */
.hero{background:radial-gradient(120% 90% at 100% 0%,var(--hero-2),var(--hero) 60%);color:var(--hero-ink);border-radius:24px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 40%,transparent),transparent 70%);opacity:.5;pointer-events:none}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:center;position:relative;z-index:1}
.hello{color:var(--hero-muted);font-size:14px;font-weight:500}
.hero h1{color:var(--hero-ink);margin-top:2px}
.hero .meta{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.pill{font:600 12px var(--mono);padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--hero-ink);white-space:nowrap}
.pill sup{font-size:9px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:rgba(255,255,255,.14)}
.ring .val{stroke:url(#ringGrad);transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring.full .val{stroke:var(--good)}
.ring .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .center b{font:800 26px var(--display)}
.ring .center span{display:block;font:600 10.5px var(--mono);color:var(--hero-muted);margin-top:4px;letter-spacing:.06em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;position:relative;z-index:1}
.wday{appearance:none;border:0;background:rgba(255,255,255,.07);border-radius:12px;padding:7px 0 8px;color:var(--hero-muted);display:flex;flex-direction:column;align-items:center;gap:5px;font:600 11px var(--mono)}
.wday b{font:700 15px var(--display);color:var(--hero-ink)}
.wday .bar{width:60%;height:4px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
.wday .bar i{display:block;height:100%;background:var(--amber)}
.wday .bar i.full{background:var(--good)}
.wday.sel{background:var(--hero-ink);color:var(--hero)}
.wday.sel b{color:var(--hero)}
.wday.sel .bar{background:rgba(27,31,59,.15)}
.wday:disabled{opacity:.35;cursor:default}
.wday.today:not(.sel){box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4)}

/* alerts, quote */
.alert{border-radius:16px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.alert svg{width:20px;height:20px;flex:none;color:var(--warn);margin-top:1px}
.quote{border-radius:16px;padding:14px 16px;background:var(--surface-2);font:600 15.5px/1.4 var(--display);letter-spacing:-.01em}
.quote small{display:block;font:500 12px var(--mono);color:var(--muted);margin-top:6px;letter-spacing:0}

/* habit cards */
.habits{display:flex;flex-direction:column;gap:10px}
.hcard{--c:var(--accent);display:flex;align-items:stretch;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hcard::before{content:"";position:absolute;inset:0;background:color-mix(in srgb,var(--c) 12%,transparent);opacity:0;transition:opacity .25s}
.hcard.done::before{opacity:1}
.htap{appearance:none;border:0;background:none;flex:1;display:flex;align-items:center;gap:12px;padding:14px 6px 14px 14px;text-align:left;min-width:0;position:relative}
.hicon{width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--c) 16%,var(--surface));display:grid;place-items:center;font-size:23px;flex:none}
.hmain{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hname{font-weight:700;font-size:16px;line-height:1.25}
.hcard.done .hname{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c) 70%,transparent);text-decoration-thickness:2px}
.hsub{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hsub .flame{display:inline-flex;align-items:center;gap:2px;font:700 12px var(--mono);color:var(--warn)}
.hsub .flame svg{width:13px;height:13px}
.tag{font:700 10.5px var(--mono);padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.tag.break{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.hmin{font-size:13px;color:var(--muted)}
.hmin b{color:var(--ink);font-weight:600}
.hcheck{width:36px;height:36px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--c) 45%,var(--line));display:grid;place-items:center;flex:none;background:var(--surface);transition:background .2s,border-color .2s,transform .2s}
.hcheck svg{width:18px;height:18px;color:#fff;opacity:0;transform:scale(.4);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.hcard.done .hcheck{background:var(--c);border-color:var(--c)}
.hcard.done .hcheck svg{opacity:1;transform:scale(1)}
.hmore{appearance:none;border:0;background:none;width:40px;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.hmore svg{width:20px;height:20px}
.hcard.pop .hcheck{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.hcard.pop{animation:lift .45s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes lift{0%{transform:scale(1)}40%{transform:scale(1.015)}100%{transform:scale(1)}}

.groups{display:flex;flex-direction:column;gap:20px}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px;font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ghead b{color:var(--ink);font-weight:700}
.gbar{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin:0 4px 2px}
.gbar i{display:block;height:100%;background:var(--good);transition:width .5s}
.add-row{appearance:none;border:2px dashed var(--line);background:none;border-radius:18px;padding:14px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px}
.add-row svg{width:18px;height:18px}

label.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=time],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical;min-height:76px;line-height:1.45}
.hint{font-size:12.5px;color:var(--muted);font-weight:500}

/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{appearance:none;border:0;background:none;flex:1;padding:9px 8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.bottom button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font:600 11px var(--body)}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button[aria-current="page"]{color:var(--accent)}
nav.bottom button[aria-current="page"] .ico{background:color-mix(in srgb,var(--accent) 14%,transparent)}
nav.bottom .ico{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:640px){ .scrim{align-items:center} .sheet{border-radius:24px;max-height:86%} }
.sheet-head{padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex:1}
.sheet-foot{padding:12px 16px;display:flex;gap:10px;border-top:1px solid var(--line);background:var(--surface)}
.sheet-foot .btn{flex:1}
.steps{display:flex;gap:6px}
.steps button{appearance:none;border:0;flex:1;height:6px;border-radius:3px;background:var(--line);padding:0}
.steps button.on{background:var(--accent)}
.steps button.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{appearance:none;border:1.5px solid transparent;background:var(--surface);border-radius:12px;aspect-ratio:1;font-size:21px;display:grid;place-items:center;padding:0;max-width:100%}
.emojis button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{appearance:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent;padding:0}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.preview{border-radius:16px;padding:14px;background:var(--surface);border:1.5px dashed var(--line);font:600 15.5px/1.45 var(--display)}
.preview em{font-style:normal;color:var(--accent)}
.law{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.law .n{font:700 11px var(--mono);color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted)}

/* progress */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.tile b{font:800 26px var(--display);letter-spacing:-.02em}
.tile span{font-size:12.5px;color:var(--muted);font-weight:500}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);display:block}
.heat i.l1{background:color-mix(in srgb,var(--good) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--good) 55%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--good) 80%,var(--surface-2))}
.heat i.l4{background:var(--good)}
.heat i.t{outline:2px solid var(--accent);outline-offset:1px}
.heat i.x{background:transparent}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.hprog{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.dots{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:6px}
.dots i{height:8px;border-radius:2px;background:var(--surface-2)}
.dots i.on{background:var(--c)}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--accent)}

/* scorecard */
.scitem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.rate{display:flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--line)}
.rate button{appearance:none;border:0;background:var(--surface);width:38px;height:40px;font:700 17px var(--mono);color:var(--muted)}
.rate button+button{border-left:1.5px solid var(--line)}
.rate button.on.plus{background:var(--good-soft);color:var(--good)}
.rate button.on.eq{background:var(--surface-2);color:var(--ink)}
.rate button.on.minus{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}

/* guide */
details.g{background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
details.g>summary{list-style:none;padding:16px;display:flex;gap:12px;align-items:center;cursor:pointer;font:700 16px var(--display)}
details.g>summary::-webkit-details-marker{display:none}
details.g>summary .gi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 13%,var(--surface));color:var(--accent);flex:none}
details.g>summary .gi svg{width:20px;height:20px}
details.g>summary::after{content:"";margin-left:auto;width:10px;height:10px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex:none}
details.g[open]>summary::after{transform:rotate(-135deg)}
.gbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:15px}
ol.steps-list{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps-list li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
ol.steps-list li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--mono)}
.lawgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lawcell{border-radius:14px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:3px}
.lawcell b{font:700 14px var(--display)}
.lawcell span{font-size:12.5px;color:var(--muted)}
.lawcell .k{font:700 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.faq b{display:block;margin-bottom:2px}

/* intro */
.intro{position:fixed;inset:0;z-index:50;background:var(--hero);color:var(--hero-ink);display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.intro .skip{align-self:flex-end;background:none;border:0;color:var(--hero-muted);font-weight:600;padding:8px}
.intro .slide{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;max-width:420px;margin:0 auto;width:100%}
.intro h2{font-size:27px;color:var(--hero-ink)}
.intro p{color:var(--hero-muted);font-size:16px;max-width:34ch}

function starterPlan(){ const p = JSON.parse(JSON.stringify(STARTER)); p.startDate = ymd(today()); if(state && state.plan && state.plan.name) p.name = state.plan.name; return p; }

const state = { plan:null, logs:{}, reviews:{}, tab:'today', selDay:null, reviewWeek:null, habitSeg:'list', sheet:null, lastFrac:null, justId:null, mode:'loading', intro:null };
let dbReadyResolve; const dbReady = new Promise(r => dbReadyResolve = r);
const pending = new Set();
let renderDeferred = false;

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const todayS = () => ymd(today());
const monthKey = s => s.slice(0,7);
const uid = () => Math.random().toString(36).slice(2,9);
const clone = o => JSON.parse(JSON.stringify(o));
function weekStart(d){ const x = new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
function isoWeek(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate()+4-day); const y = t.getUTCFullYear(); return y+'-W'+pad(Math.ceil(((t - Date.UTC(y,0,1))/864e5 + 1)/7)); }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(LS+k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(e){} }
function lsKeys(prefix){ const out=[]; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.startsWith(LS+prefix)) out.push(k.slice(LS.length)); } }catch(e){} return out; }
function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function plan(){
  if(!state.plan) state.plan = starterPlan();
  const p = state.plan; ['identities','goals','habits','scorecard'].forEach(k => { if(!Array.isArray(p[k])) p[k] = []; });
  if(!p.startDate) p.startDate = todayS();
  return p;
}
const habits = () => plan().habits;
const afterWord = st => /^(my|the|a|an|i|it|we|someone)\b/i.test((st||'').trim()) ? 'After ' : 'After I ';
const hColor = (h,i) => h.color || COLORS[(i ?? habits().indexOf(h)) % COLORS.length];
const hEmoji = h => h.emoji || (h.kind === 'break' ? '📵' : '🎯');
const identityText = id => (plan().identities.find(i => i.id === id) || {}).text || '';
function isDone(date, hid){ const m = state.logs[monthKey(date)]; return !!(m && m.days && m.days[date] && m.days[date].done && m.days[date].done[hid]); }
function dayRec(date, create){
  const mk = monthKey(date);
  if(!state.logs[mk]){ if(!create) return null; state.logs[mk] = { days:{} }; }
  const m = state.logs[mk]; if(!m.days) m.days = {};
  if(!m.days[date]){ if(!create) return null; m.days[date] = { done:{} }; }
  if(!m.days[date].done) m.days[date].done = {};
  return m.days[date];
}
const doneCount = (date) => habits().filter(h => isDone(date, h.id)).length;
function streak(hid){ let d = today(); if(!isDone(ymd(d), hid)) d = addDays(d,-1); let n = 0; while(isDone(ymd(d), hid) && n < 3650){ n++; d = addDays(d,-1); } return n; }
function bestStreak(hid){ let best = 0, cur = 0, d = parse(plan().startDate); const end = today(); while(d <= end){ if(isDone(ymd(d), hid)){ cur++; if(cur > best) best = cur; } else cur = 0; d = addDays(d,1); } return best; }
function rate(hid, days){ const start = parse(plan().startDate); let hit = 0, total = 0; for(let i=0;i<days;i++){ const d = addDays(today(), -i); if(d < start) break; total++; if(isDone(ymd(d), hid)) hit++; } return total ? hit/total : 0; }
function allVotes(){ let n = 0, showUp = 0; const ids = new Set(habits().map(h => h.id)); Object.values(state.logs).forEach(m => Object.values(m.days || {}).forEach(r => { const c = Object.keys(r.done || {}).filter(k => r.done[k] && ids.has(k)).length; n += c; if(c) showUp++; })); return { n, showUp }; }

/* ---------- persistence ---------- */
const timers = {}, chains = {};
function setStatus(kind, text){ document.getElementById('status').innerHTML = '<span class="dot '+kind+'"></span><span>'+esc(text)+'</span>'; }
function modeStatus(){ if(state.mode === 'db') setStatus('ok','Synced'); else if(state.mode === 'local') setStatus(IS_SITE ? 'ok' : 'local', IS_SITE ? 'Saved on this device' : 'This device only'); }
function queueWrite(path, getData, delay){
  pending.add(path); clearTimeout(timers[path]);
  timers[path] = setTimeout(() => {
    chains[path] = (chains[path] || Promise.resolve()).then(async () => {
      const data = clone(getData() || {});
      lsSet(path, data);
      const db = await dbReady;
      if(!db){ pending.delete(path); return; }
      setStatus('ok','Saving');
      const attempt = () => db.doc(path).set(data);
      try { await attempt(); modeStatus(); }
      catch(e){
        if(e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 800 + Math.random()*800)); try { await attempt(); modeStatus(); } catch(e2){ setStatus('err','Not saved'); toast('Could not save. Check your connection and try again.'); } }
        else { setStatus('err','Not saved'); toast('Could not save: '+((e && (e.message || e.code)) || 'unknown error')); }
      }
      pending.delete(path);
    });
  }, delay ?? 500);
}
const savePlan = d => queueWrite('system/plan', () => state.plan, d);
const saveMonth = (mk, d) => queueWrite('log/'+mk, () => state.logs[mk], d);
const saveReview = (wk, d) => queueWrite('reviews/'+wk, () => state.reviews[wk], d);

function loadLocal(){
  state.plan = lsGet('system/plan');
  lsKeys('log/').forEach(k => { const v = lsGet(k); if(v) state.logs[k.slice(4)] = v; });
  lsKeys('reviews/').forEach(k => { const v = lsGet(k); if(v) state.reviews[k.slice(8)] = v; });
}
async function connect(){
  if(!IS_SITE) for(let i=0;i<30 && !(window.claude && window.claude.use);i++) await new Promise(r => setTimeout(r, 100));
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(e){ db = null; }
  if(!db){ state.mode = 'local'; dbReadyResolve(null); modeStatus(); if(!lsGet('system/plan')) savePlan(0); scheduleRender(); return; }
  state.mode = 'db'; dbReadyResolve(db); modeStatus();
  const onErr = () => setStatus('err','Sync paused');
  db.doc('system/plan').onSnapshot(snap => {
    if(pending.has('system/plan')) return;
    if(snap.exists){ state.plan = clone(snap.data()); lsSet('system/plan', state.plan); }
    scheduleRender();
  }, onErr);
  db.collection('log').onSnapshot(snap => {
    snap.docs.forEach(d => { const p = 'log/'+d.id; if(pending.has(p)) return; state.logs[d.id] = clone(d.data()); lsSet(p, state.logs[d.id]); });
    scheduleRender();
  }, onErr);
  db.collection('reviews').onSnapshot(snap => {
    snap.docs.forEach(d => { const p = 'reviews/'+d.id; if(pending.has(p)) return; state.reviews[d.id] = clone(d.data()); lsSet(p, state.reviews[d.id]); });
    scheduleRender();
  }, onErr);
}

function confetti(){

  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const cols = ['#FF5A36','#FFB23E','#17A884','#3B8BEB','#8B5CF6','#E4468B'];
  const ps = Array.from({length:140}, () => ({ x:innerWidth/2 + (Math.random()-.5)*80, y:innerHeight*0.32, vx:(Math.random()-.5)*13, vy:-Math.random()*13-4, r:Math.random()*6+4, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, va:(Math.random()-.5)*.3 }));

    cells.push(`<i class="${l} ${s === todayS() ? 't' : ''}" title="${s}: ${Math.round(f*100)}%"></i>`); }
  const idVotes = {}; plan().identities.forEach(i => idVotes[i.id] = 0);

        return `<div class="hprog" style="--c:${hColor(h,i)}"><span class="hicon" style="width:40px;height:40px;font-size:20px" aria-hidden="true">${esc(hEmoji(h))}</span>

          <div style="text-align:right"><div class="mono" style="font-weight:700">${Math.round(r*100)}%</div><div class="muted mono" style="font-size:11.5px">🔥${streak(h.id)} · best ${bestStreak(h.id)}</div></div></div>`; }).join('') || '<p class="muted small">No habits yet.</p>'}
    </div>

}

/* ---------- backup ---------- */
function backupJSON(){ return JSON.stringify({ app:'the-1-percent-system', version:1, exported:new Date().toISOString(), plan:state.plan, logs:state.logs, reviews:state.reviews }); }
function restoreBackup(text){
  let d; try { d = JSON.parse(text); } catch(e){ toast('That text is not a valid backup. Copy the whole backup and try again.'); return; }
  if(!d || d.app !== 'the-1-percent-system' || !d.plan){ toast('This is not a 1% System backup.'); return; }
  state.plan = d.plan; savePlan(50);
  Object.entries(d.logs || {}).forEach(([mk,v]) => { state.logs[mk] = v; saveMonth(mk, 50); });
  Object.entries(d.reviews || {}).forEach(([wk,v]) => { state.reviews[wk] = v; saveReview(wk, 50); });
  state.backupText = ''; state.lastFrac = null; render(); toast('Backup restored');
}

document.getElementById('view').addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if(!b) return;
  const a = b.dataset.action, id = b.dataset.id, p = plan();
  if(a !== 'bk-restore') state.confirmImport = false;
  if(a !== 'starter') state.confirmStarter = false;

    if(r.done[id]) delete r.done[id]; else { r.done[id] = true; state.justId = id; }

    const h = p.habits.find(x => x.id === id);

      if(n && doneCount(sel) === n && before < n){ confetti(); buzz([20,40,20]); toast('All done. Every vote counted today.'); }
      else if(h && identityText(h.identity)) toast('+1 vote: '+identityText(h.identity));
      else toast('Done. Streak: '+streak(id)+(streak(id) === 1 ? ' day' : ' days'));
    }

  else if(a === 'new-habit') openEditor(null);
  else if(a === 'seg'){ state.habitSeg = b.dataset.v; render(); }

  else if(a === 'add-goal'){ const g = { id:uid(), goal:'', system:'' }; p.goals.push(g); savePlan(); render(); const el = document.getElementById('g-'+g.id+'-goal'); el && el.focus(); }
  else if(a === 'del-goal'){ p.goals = p.goals.filter(g => g.id !== id); savePlan(100); render(); }

  else if(a === 'del-score'){ p.scorecard = p.scorecard.filter(s => s.id !== id); savePlan(100); render(); }
  else if(a === 'rate'){ const s = p.scorecard.find(x => x.id === id); if(s){ s.rating = b.dataset.v; savePlan(200); render(); } }

  else if(a === 'bk-copy'){

    const blob = new Blob([backupJSON()], { type:'application/json' }); const u = URL.createObjectURL(blob);
    const link = document.createElement('a'); link.href = u; link.download = '1-percent-system-backup-'+todayS()+'.json'; document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000);
  }

    state.openBackup = true;

document.getElementById('view').addEventListener('input', e => {

  else if(kind === 'score'){ const s = p.scorecard.find(x => x.id === id); if(s){ s.text = v; savePlan(); } }
  else if(kind === 'note'){ const r = dayRec(id, true); r.note = v; saveMonth(monthKey(id), 700); }
  else if(kind === 'review'){ state.reviews[id] = state.reviews[id] || {}; state.reviews[id][field] = v; saveReview(id, 700); }
});

document.getElementById('view').addEventListener('change', e => {
  if(e.target.id !== 'bk-file' || !e.target.files || !e.target.files[0]) return;
  const r = new FileReader(); r.onload = () => { state.backupText = String(r.result || ''); state.openBackup = true; state.confirmImport = false; render(); toast('File loaded. Tap Restore to use it.'); }; r.readAsText(e.target.files[0]);
});

/* ---------- boot ---------- */
loadLocal();
const savedTab = lsGet('ui:tab'); if(savedTab && TABS.some(t => t[0] === savedTab)) state.tab = savedTab;
if(!lsGet('ui:intro')) state.intro = 0;
render(); renderIntro();
connect();
let lastDay = todayS();
setInterval(() => { const d = todayS(); if(d !== lastDay){ lastDay = d; state.selDay = null; scheduleRender(); } }, 60000);
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
