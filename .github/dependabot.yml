# Weekly check for security fixes in the CRM's building blocks and in the
# GitHub Actions used to test and publish it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /crm
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
