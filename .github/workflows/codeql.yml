name: Code scanning

# GitHub's own security scanner reads the CRM's code for known kinds of
# security mistakes on every change and once a week.
on:
  pull_request:
    paths: ['crm/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['crm/**', '.github/workflows/**']
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
