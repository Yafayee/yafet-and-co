name: CRM checks

# Runs on every pull request and on main: lint, type check, unit tests and a production build.
on:
  pull_request:
    paths: ['crm/**', '.github/workflows/crm-tests.yml']
  push:
    branches: [main]
    paths: ['crm/**', '.github/workflows/crm-tests.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
