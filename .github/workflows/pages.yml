name: Publish site to gh-pages

# GitHub Pages serves this site from the gh-pages branch.
# Every push to main copies the site there, and Pages rebuilds automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '/archive/' --exclude '/README.md' ./ _site/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          commit_message: 'Publish ${{ github.sha }}'
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "Build request not accepted; the push above triggers a build anyway."
