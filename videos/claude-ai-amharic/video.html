<!doctype html>
<html lang="am">
<head>
<meta charset="utf-8">
<title>Claude AI Amharic Explainer</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root {
    --orange: #E8845F;
    --orange2: #FFB38A;
    --cyan: #7EE8FF;
    --ink: #120F2A;
    --text: #F5F3FF;
    --muted: #B9B2E6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0B0A1F; }
  body { font-family: 'Noto Sans Ethiopic', 'Poppins', sans-serif; color: var(--text); }
  .latin { font-family: 'Poppins', 'Noto Sans Ethiopic', sans-serif; }
  #stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(1200px 900px at 50% 30%, #2A1F63 0%, #15113A 45%, #0B0A1F 100%); }
  #grid { position: absolute; inset: -200px; opacity: .18;
    background-image: linear-gradient(rgba(126,232,255,.35) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(126,232,255,.35) 1px, transparent 1px);
    background-size: 90px 90px; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--cyan);
    box-shadow: 0 0 14px var(--cyan); }

  /* Header */
  #header { position: absolute; top: 90px; left: 0; right: 0; display: flex; justify-content: center; }
  .pill { display: flex; align-items: center; gap: 18px; padding: 16px 34px; border-radius: 999px;
    background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14);
    font-size: 36px; font-weight: 800; letter-spacing: .5px; }
  .pill .sep { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); }

  /* Board */
  #board { position: absolute; left: 60px; top: 210px; width: 960px; height: 860px; border-radius: 48px;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    border: 2px solid rgba(255,255,255,.16);
    box-shadow: 0 40px 120px rgba(0,0,0,.45), inset 0 0 80px rgba(126,232,255,.06); overflow: hidden; }
  #board::before { content: ''; position: absolute; inset: 0; border-radius: 48px; padding: 3px;
    background: linear-gradient(120deg, var(--orange), transparent 35%, transparent 65%, var(--cyan));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: .8; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 60px; }
  [data-in] { will-change: transform, opacity; }

  .big { font-size: 170px; font-weight: 800; line-height: 1.1;
    background: linear-gradient(90deg, var(--orange2), var(--orange), #FF6FB5);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .h1 { font-size: 76px; font-weight: 800; line-height: 1.25; }
  .h2 { font-size: 54px; font-weight: 500; line-height: 1.4; color: var(--muted); }
  .accent { color: var(--orange); }
  .cyan { color: var(--cyan); }

  .logoWrap { width: 250px; height: 250px; margin: 10px 0 30px; position: relative; }
  .glow { position: absolute; inset: -40px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,132,95,.55), transparent 65%); }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; margin-top: 46px; width: 100%; }
  .card { background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14); border-radius: 36px;
    padding: 34px 20px 30px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .card .ic { width: 120px; height: 120px; border-radius: 32px; display: grid; place-items: center; }
  .card .lbl { font-size: 52px; font-weight: 800; }

  .chat { width: 100%; display: flex; flex-direction: column; gap: 34px; margin-top: 40px; }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .row.user { justify-content: flex-end; }
  .avatar { width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  .bubble { max-width: 640px; padding: 30px 38px; border-radius: 40px; font-size: 48px; font-weight: 500;
    line-height: 1.4; text-align: left; }
  .user .bubble { background: linear-gradient(135deg, #5B4BDB, #7D5CFF); border-bottom-right-radius: 10px; }
  .bot .bubble { background: #F7F3EE; color: #2A2140; border-bottom-left-radius: 10px; }
  .typing { display: flex; gap: 14px; padding: 36px 40px; }
  .typing i { width: 18px; height: 18px; border-radius: 50%; background: #9A8FC8; display: block; }

  .badges { display: flex; flex-direction: column; gap: 26px; width: 100%; margin-top: 10px; }
  .badge { display: flex; align-items: center; gap: 30px; padding: 26px 40px; border-radius: 32px;
    background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14); font-size: 58px; font-weight: 800; }
  .check { width: 80px; height: 80px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .cta { margin-top: 44px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .cta .try { font-size: 52px; font-weight: 800; }
  .btn { font-size: 66px; font-weight: 800; padding: 22px 70px; border-radius: 999px;
    background: linear-gradient(90deg, var(--orange), #FF7A9C); box-shadow: 0 20px 60px rgba(232,132,95,.55); }

  /* Robot */
  #robot { position: absolute; left: 190px; top: 1045px; width: 700px; height: 700px; }

  /* Caption */
  #caption { position: absolute; left: 50px; right: 50px; top: 1735px; min-height: 130px; border-radius: 34px;
    background: rgba(8,6,24,.78); border: 2px solid rgba(255,255,255,.12);
    display: flex; flex-wrap: wrap; align-content: center; align-items: center; justify-content: center; padding: 20px 40px; text-align: center;
    font-size: 44px; font-weight: 800; line-height: 1.35; }
  #caption .w { display: inline-block; margin: 0 .16em; transition: none; }
  #progress { position: absolute; left: 0; bottom: 0; height: 12px; width: 0;
    background: linear-gradient(90deg, var(--orange), var(--cyan)); }
</style>
</head>
<body>
<div id="stage">
  <div id="grid"></div>
  <div class="orb" id="orb1" style="width:520px;height:520px;background:#E8845F;left:-160px;top:1100px"></div>
  <div class="orb" id="orb2" style="width:600px;height:600px;background:#5B4BDB;right:-200px;top:120px"></div>
  <div id="dots"></div>

  <div id="header"><div class="pill"><span class="latin">Claude AI</span><span class="sep"></span><span>በአማርኛ</span></div></div>

  <div id="board">
    <!-- Scene 1: greeting -->
    <div class="scene" id="s1">
      <div class="big" data-in="0.2" data-out="3.8" data-fx="pop">ሰላም!</div>
      <div class="h1" data-in="0.8" data-out="3.8" data-fx="up" style="margin-top:30px">ዛሬ ስለ <span class="latin accent">Claude AI</span></div>
      <div class="h1" data-in="1.2" data-out="3.8" data-fx="up">እንማር</div>
      <div class="h2" data-in="1.8" data-out="3.8" data-fx="up" style="margin-top:34px">ከሮቦት መምህራችሁ ጋር</div>
    </div>

    <!-- Scene 2: what is Claude -->
    <div class="scene" id="s2">
      <div class="h1" data-in="4.1" data-out="7.8" data-fx="up"><span class="latin">Claude</span> ምንድን ነው?</div>
      <div class="logoWrap" data-in="4.5" data-out="7.8" data-fx="pop">
        <div class="glow"></div>
        <svg id="spark" viewBox="-100 -100 200 200" width="250" height="250" style="position:relative"></svg>
      </div>
      <div class="h1" data-in="5.2" data-out="7.8" data-fx="up" style="font-size:66px">ሰው ሰራሽ አስተውሎት <span class="latin cyan">(AI)</span> ረዳት</div>
      <div class="h2" data-in="5.8" data-out="7.8" data-fx="up" style="margin-top:20px">በ <span class="latin accent" style="font-weight:800">Anthropic</span> የተሰራ</div>
    </div>

    <!-- Scene 3: abilities -->
    <div class="scene" id="s3">
      <div class="h1" data-in="8.1" data-out="11.8" data-fx="up">ምን ማድረግ ይችላል?</div>
      <div class="cards">
        <div class="card" data-in="8.6" data-out="11.8" data-fx="pop">
          <div class="ic" style="background:linear-gradient(135deg,#E8845F,#FF6FB5)">
            <svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </div><div class="lbl">መጻፍ</div>
        </div>
        <div class="card" data-in="9.0" data-out="11.8" data-fx="pop">
          <div class="ic" style="background:linear-gradient(135deg,#5B4BDB,#7EE8FF)">
            <svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5"/><path d="m16 7 5 5-5 5"/><path d="m14 4-4 16"/></svg>
          </div><div class="lbl">ኮድ</div>
        </div>
        <div class="card" data-in="9.4" data-out="11.8" data-fx="pop">
          <div class="ic" style="background:linear-gradient(135deg,#1FB985,#7EE8FF)">
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19"/><path d="M12 2.5c2.8 2.8 4 6 4 9.5s-1.2 6.7-4 9.5c-2.8-2.8-4-6-4-9.5s1.2-6.7 4-9.5Z"/></svg>
          </div><div class="lbl">መተርጎም</div>
        </div>
        <div class="card" data-in="9.8" data-out="11.8" data-fx="pop">
          <div class="ic" style="background:linear-gradient(135deg,#F5B83D,#E8845F)">
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2.5a6.5 6.5 0 0 0-4 11.6c.7.6 1 1.4 1 2.4h6c0-1 .3-1.8 1-2.4a6.5 6.5 0 0 0-4-11.6Z"/></svg>
          </div><div class="lbl">ማስረዳት</div>
        </div>
      </div>
    </div>

    <!-- Scene 4: chat demo -->
    <div class="scene" id="s4">
      <div class="h1" data-in="12.1" data-out="15.8" data-fx="up">በአማርኛ ይጠይቁት!</div>
      <div class="chat">
        <div class="row user" data-in="12.6" data-out="15.8" data-fx="right">
          <div class="bubble">ሰላም <span class="latin">Claude</span>፣ ኢሜይል እንድጽፍ እርዳኝ</div>
          <div class="avatar" style="background:#7D5CFF">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.4 3.8-7.5 8.5-7.5s8.5 3.1 8.5 7.5Z"/></svg>
          </div>
        </div>
        <div class="row bot" data-in="13.3" data-out="14.2" data-fx="left" id="typingRow">
          <div class="avatar" style="background:#F7F3EE"><svg class="miniSpark" viewBox="-100 -100 200 200" width="60" height="60"></svg></div>
          <div class="bubble typing"><i></i><i></i><i></i></div>
        </div>
        <div class="row bot" data-in="14.2" data-out="15.8" data-fx="left" style="margin-top:-126px">
          <div class="avatar" style="background:#F7F3EE"><svg class="miniSpark" viewBox="-100 -100 200 200" width="60" height="60"></svg></div>
          <div class="bubble">በደስታ! ማንን ነው የሚጽፉት? አብረን እንጀምር።</div>
        </div>
      </div>
    </div>

    <!-- Scene 5: values + CTA -->
    <div class="scene" id="s5">
      <div class="badges">
        <div class="badge" data-in="16.2" data-out="20.5" data-fx="left">
          <div class="check" style="background:#1FB985"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg></div>ጠቃሚ
        </div>
        <div class="badge" data-in="16.6" data-out="20.5" data-fx="left">
          <div class="check" style="background:#5B4BDB"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg></div>ታማኝ
        </div>
        <div class="badge" data-in="17.0" data-out="20.5" data-fx="left">
          <div class="check" style="background:#E8845F"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg></div>ደህንነቱ የተጠበቀ
        </div>
      </div>
      <div class="cta">
        <div class="try" data-in="17.7" data-out="20.5" data-fx="up">ዛሬውኑ ይሞክሩት</div>
        <div class="btn latin" id="ctaBtn" data-in="18.1" data-out="20.5" data-fx="pop">claude.ai</div>
      </div>
    </div>
  </div>

  <!-- Robot teacher -->
  <svg id="robot" viewBox="0 0 700 700" style="overflow:visible">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9C2EE"/>
      </linearGradient>
      <linearGradient id="metal2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F2EEFF"/><stop offset="1" stop-color="#A89FDA"/>
      </linearGradient>
      <radialGradient id="hover" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#7EE8FF" stop-opacity=".9"/><stop offset="1" stop-color="#7EE8FF" stop-opacity="0"/>
      </radialGradient>
      <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <ellipse id="hoverGlow" cx="350" cy="655" rx="170" ry="34" fill="url(#hover)"/>
    <g id="bot">
      <!-- left arm (robot's right) -->
      <g id="armL" transform="rotate(15 205 395)">
        <rect x="183" y="395" width="44" height="150" rx="22" fill="url(#metal2)"/>
        <circle cx="205" cy="560" r="32" fill="url(#metal)" stroke="#A89FDA" stroke-width="4"/>
      </g>
      <!-- right arm with pointer -->
      <g id="armR" transform="rotate(160 495 395)">
        <g id="pointer">
          <line x1="495" y1="560" x2="495" y2="795" stroke="#8A5A3C" stroke-width="12" stroke-linecap="round"/>
          <circle cx="495" cy="800" r="15" fill="#E8845F" filter="url(#glowF)"/>
        </g>
        <rect x="473" y="395" width="44" height="150" rx="22" fill="url(#metal2)"/>
        <circle cx="495" cy="560" r="32" fill="url(#metal)" stroke="#A89FDA" stroke-width="4"/>
      </g>
      <!-- torso -->
      <rect x="200" y="360" width="300" height="250" rx="80" fill="url(#metal)"/>
      <rect x="258" y="420" width="184" height="120" rx="28" fill="#120F2A"/>
      <g id="chestSpark" transform="translate(350 480)"></g>
      <rect x="258" y="555" width="184" height="12" rx="6" fill="#DAD4F7"/>
      <!-- neck + bow tie -->
      <rect x="315" y="330" width="70" height="40" rx="12" fill="#A89FDA"/>
      <g transform="translate(350 372)">
        <path d="M0 0 L-46 -24 L-46 24 Z" fill="#E8845F"/>
        <path d="M0 0 L46 -24 L46 24 Z" fill="#E8845F"/>
        <circle r="12" fill="#C9603E"/>
      </g>
      <!-- head -->
      <g id="head">
        <circle cx="160" cy="235" r="30" fill="#E8845F"/>
        <circle cx="540" cy="235" r="30" fill="#E8845F"/>
        <rect x="165" y="115" width="370" height="230" rx="100" fill="url(#metal)"/>
        <rect x="205" y="155" width="290" height="155" rx="66" fill="#120F2A"/>
        <!-- eyes -->
        <g filter="url(#glowF)">
          <ellipse id="eyeL" cx="290" cy="220" rx="22" ry="27" fill="#7EE8FF"/>
          <ellipse id="eyeR" cx="410" cy="220" rx="22" ry="27" fill="#7EE8FF"/>
          <rect id="mouth" x="320" y="262" width="60" height="10" rx="5" fill="#7EE8FF"/>
        </g>
        <circle cx="290" cy="220" r="44" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="6"/>
        <circle cx="410" cy="220" r="44" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="6"/>
        <path d="M334 216 q16 -12 32 0" fill="none" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="6"/>
        <ellipse cx="248" cy="275" rx="18" ry="10" fill="#FF6FB5" opacity=".55"/>
        <ellipse cx="452" cy="275" rx="18" ry="10" fill="#FF6FB5" opacity=".55"/>
        <!-- graduation cap -->
        <g transform="rotate(-6 350 110)">
          <path d="M275 108 L275 140 Q350 165 425 140 L425 108 Z" fill="#221D3F"/>
          <polygon points="200,105 350,55 500,105 350,155" fill="#2E2757"/>
          <polygon points="200,105 350,55 500,105 350,155" fill="none" stroke="#4A4185" stroke-width="3"/>
          <circle cx="350" cy="105" r="9" fill="#E8845F"/>
          <g id="tassel">
            <path d="M350 105 L470 118 L470 175" fill="none" stroke="#E8845F" stroke-width="5" stroke-linecap="round"/>
            <rect x="460" y="170" width="20" height="36" rx="6" fill="#E8845F"/>
          </g>
        </g>
      </g>
    </g>
  </svg>

  <div id="caption"></div>
  <div id="progress"></div>
</div>

<script>
const DURATION = 20;
const CAPTIONS = [
  [0.3, 3.8, 'ሰላም! እኔ ሮቦት መምህራችሁ ነኝ። ዛሬ ስለ Claude AI እንማር።'],
  [4.2, 7.8, 'Claude በAnthropic የተሰራ ብልህ የAI ረዳት ነው።'],
  [8.2, 11.8, 'ይጽፋል፣ ኮድ ይሰራል፣ ይተረጉማል፣ ያስረዳል።'],
  [12.2, 15.8, 'ጥያቄዎን በአማርኛ ይጠይቁት — ወዲያውኑ ይረዳዎታል!'],
  [16.2, 19.8, 'ጠቃሚ፣ ታማኝ እና ደህንነቱ የተጠበቀ። ዛሬውኑ ይሞክሩት!'],
];

// Claude-style sparkle: rounded rays radiating from the centre
function sparkPath(rays, rOut, rIn, wobble = 0) {
  let d = '';
  for (let i = 0; i < rays; i++) {
    const a = (i / rays) * Math.PI * 2 - Math.PI / 2;
    const len = rOut * (i % 2 ? 0.82 : 1) + wobble;
    const w = 0.13;
    const x1 = Math.cos(a - w) * rIn, y1 = Math.sin(a - w) * rIn;
    const x2 = Math.cos(a) * len, y2 = Math.sin(a) * len;
    const x3 = Math.cos(a + w) * rIn, y3 = Math.sin(a + w) * rIn;
    d += `M0 0 L${x1.toFixed(1)} ${y1.toFixed(1)} Q${(x2*1.02).toFixed(1)} ${(y2*1.02).toFixed(1)} ${x3.toFixed(1)} ${y3.toFixed(1)} Z `;
  }
  return d;
}
document.getElementById('spark').innerHTML = `<path d="${sparkPath(12, 92, 30)}" fill="#E8845F"/><circle r="26" fill="#E8845F"/>`;
document.querySelectorAll('.miniSpark').forEach(s => s.innerHTML = `<path d="${sparkPath(12, 88, 30)}" fill="#D9774F"/><circle r="26" fill="#D9774F"/>`);
const chest = document.getElementById('chestSpark');
chest.innerHTML = `<g id="chestInner" filter="url(#glowF)"><path d="${sparkPath(12, 42, 14)}" fill="#E8845F"/><circle r="12" fill="#E8845F"/></g>`;

// Floating particles (seeded so every render is identical)
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const dotsEl = document.getElementById('dots');
const dots = Array.from({length: 38}, () => {
  const el = document.createElement('div'); el.className = 'dot'; dotsEl.appendChild(el);
  const s = 0.4 + rnd() * 1.3;
  el.style.width = el.style.height = (8 * s) + 'px';
  if (rnd() > .7) { el.style.background = '#E8845F'; el.style.boxShadow = '0 0 14px #E8845F'; }
  return { el, x: rnd() * 1080, y: rnd() * 1920, sp: 20 + rnd() * 60, ph: rnd() * 6.28, o: .25 + rnd() * .6 };
});

// Caption words
const capEl = document.getElementById('caption');
let capIdx = -1, capWords = [];
function setCaption(i) {
  if (i === capIdx) return; capIdx = i; capEl.innerHTML = '';
  if (i < 0) { capWords = []; return; }
  capWords = CAPTIONS[i][2].split(' ').map(w => {
    const s = document.createElement('span'); s.className = 'w' + (/^[A-Za-z]/.test(w) ? ' latin' : '');
    s.textContent = w; capEl.appendChild(s); return s;
  });
}

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const items = [...document.querySelectorAll('[data-in]')];
const $ = id => document.getElementById(id);

function render(t) {
  // background motion
  $('grid').style.transform = `translate(${(t * 18) % 90}px, ${(t * 30) % 90}px)`;
  $('orb1').style.transform = `translate(${Math.sin(t * .6) * 80}px, ${Math.cos(t * .5) * 60}px)`;
  $('orb2').style.transform = `translate(${Math.cos(t * .4) * 90}px, ${Math.sin(t * .7) * 70}px)`;
  for (const d of dots) {
    const y = ((d.y - t * d.sp) % 1920 + 1920) % 1920;
    d.el.style.transform = `translate(${d.x + Math.sin(t + d.ph) * 20}px, ${y}px)`;
    d.el.style.opacity = d.o * (0.6 + 0.4 * Math.sin(t * 2 + d.ph));
  }

  // board items
  for (const el of items) {
    const tin = +el.dataset.in, tout = +el.dataset.out, fx = el.dataset.fx;
    const p = clamp((t - tin) / 0.55), q = clamp((t - tout) / 0.35);
    const vis = t >= tin && q < 1;
    el.style.visibility = vis ? 'visible' : 'hidden';
    if (!vis) continue;
    const e = fx === 'pop' ? easeBack(p) : easeOut(p);
    let tr = '';
    if (fx === 'pop') tr = `scale(${0.3 + 0.7 * e})`;
    if (fx === 'up') tr = `translateY(${(1 - e) * 60}px)`;
    if (fx === 'left') tr = `translateX(${(1 - e) * -120}px)`;
    if (fx === 'right') tr = `translateX(${(1 - e) * 120}px)`;
    tr += ` translateY(${-q * 40}px)`;
    el.style.opacity = clamp(p * 1.6) * (1 - q);
    el.style.transform = tr;
  }
  $('spark').style.transform = `rotate(${t * 40}deg)`;
  document.querySelectorAll('.typing i').forEach((d, i) => d.style.transform = `translateY(${Math.sin(t * 10 - i * .8) * 8}px)`);
  $('ctaBtn').style.boxShadow = `0 20px ${60 + Math.sin(t * 6) * 25}px rgba(232,132,95,${.45 + Math.sin(t * 6) * .2})`;

  // captions + talking state
  let ci = CAPTIONS.findIndex(c => t >= c[0] - .05 && t <= c[1] + .15);
  setCaption(ci);
  let talking = 0;
  if (ci >= 0) {
    const [a, b] = CAPTIONS[ci];
    const n = capWords.length, span = (b - a) * 0.8;
    capWords.forEach((w, i) => {
      const k = clamp((t - a - (i / n) * span) / 0.22);
      w.style.opacity = 0.18 + 0.82 * k;
      w.style.transform = `translateY(${(1 - easeOut(k)) * 14}px)`;
      w.style.color = k > 0 && k < 1 ? '#FFB38A' : '';
    });
    talking = t < a + span + 0.2 ? 1 : 0;
    capEl.style.opacity = clamp((t - a + .05) / .2) * (1 - clamp((t - b) / .15));
  } else capEl.style.opacity = 0;

  // robot
  const bob = Math.sin(t * 2.2) * 10;
  $('bot').setAttribute('transform', `translate(0 ${bob})`);
  $('hoverGlow').setAttribute('rx', 160 - bob * 2);
  $('hoverGlow').setAttribute('opacity', .75 + Math.sin(t * 2.2) * .2);
  $('head').setAttribute('transform', `rotate(${Math.sin(t * 1.3) * 4} 350 330)`);
  $('tassel').setAttribute('transform', `rotate(${Math.sin(t * 3) * 6} 470 118)`);
  // blink
  const blinkTimes = [1.6, 5.1, 8.0, 10.9, 13.6, 17.2, 19.3];
  let open = 1; for (const b of blinkTimes) { const d = Math.abs(t - b); if (d < .09) open = Math.min(open, d / .09); }
  $('eyeL').setAttribute('ry', 3 + 24 * open); $('eyeR').setAttribute('ry', 3 + 24 * open);
  // happy eyes at the end
  // mouth
  const m = talking ? 10 + Math.abs(Math.sin(t * 17)) * 16 + Math.abs(Math.sin(t * 7.3)) * 8 : 10;
  $('mouth').setAttribute('height', m); $('mouth').setAttribute('y', 267 - m / 2);
  $('mouth').setAttribute('width', talking ? 56 : 70); $('mouth').setAttribute('x', talking ? 322 : 315);
  // arms: wave during greeting, then point at the board
  const armR = $('armR');
  let angR;
  if (t < 3.6) angR = 228 + Math.sin(t * 9) * 20;              // waving
  else { const k = easeOut(clamp((t - 3.6) / .6)); angR = 228 + (212 - 228) * k + Math.sin(t * 2.5) * 4; }
  armR.setAttribute('transform', `rotate(${angR} 495 395)`);
  $('pointer').style.opacity = clamp((t - 3.7) / .4);
  let angL = 18 + Math.sin(t * 2.2) * 5;
  if (t > 16.2) angL = 18 + (140 - 18) * easeOut(clamp((t - 16.2) / .5)) + Math.sin(t * 5) * 6; // celebrate
  $('armL').setAttribute('transform', `rotate(${angL} 205 395)`);
  $('chestInner').setAttribute('transform', `rotate(${t * 60}) scale(${1 + Math.sin(t * 4) * .08})`);

  $('progress').style.width = (clamp(t / DURATION) * 100) + '%';
}
window.render = render;
render(0);
</script>
</body>
</html>
